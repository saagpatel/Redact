name: Redact
options:
  bundleIdPrefix: com.redact
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Redact:
    type: application
    platform: iOS
    sources:
      - path: Redact
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.redact.app
        DEVELOPMENT_TEAM: 3TGZFKFNA4
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Redact
        # iPhone only. The writing surface is a single portrait column sized for a
        # thumb-reachable keyboard and has no iPad layout.
        # This builds an iPhone binary; it does not by itself keep the app off iPad,
        # since iPhone-only apps still install there in compatibility mode. Excluding
        # iPad is an App Store availability setting.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: false
    scheme:
      testTargets:
        - RedactTests

  RedactTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RedactTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Redact
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.redact.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Redact.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Redact"
        BUNDLE_LOADER: "$(TEST_HOST)"

  RedactTestHarness:
    type: application
    platform: iOS
    sources:
      - path: RedactTestHarness
        excludes:
          - "**/.DS_Store"
      - path: Redact/Engine
      - path: Redact/Models
      - path: Redact/Extensions
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.redact.testharness
        PRODUCT_NAME: RedactTestHarness
    scheme: {}

  # App Store screenshot capture. Deliberately NOT in the Redact scheme's
  # testTargets: UI tests boot and drive the app, which would add minutes to
  # `make test` and to every CI run for something only needed at release time.
  # It gets its own scheme instead — see `schemes:` below.
  RedactUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RedactUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Redact
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.redact.uitests
        TEST_TARGET_NAME: Redact

schemes:
  RedactScreenshots:
    build:
      targets:
        Redact: all
        RedactUITests: [test]
    test:
      targets:
        - RedactUITests
